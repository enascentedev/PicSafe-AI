[project]
name = "picsafe-ai"
version = "0.1.0"
description = "PoC de pré-avaliação visual de segurança de máquinas"
authors = [{name = "Equipe PicSafe AI"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "jinja2>=3.1.6,<4",
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10,<5",
    "pillow>=11.3,<13",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "black>=25.1,<27",
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pre-commit>=4.2,<5",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/picsafe_ai"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "S", "SIM", "RUF", "T20", "G", "TID"]
ignore = ["S101", "S104"]

[tool.ruff.lint.per-file-ignores]
"src/picsafe_ai/reporting/report_html.py" = ["E501"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["picsafe_ai"]

[[tool.mypy.overrides]]
module = ["cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --cov=picsafe_ai --cov-branch --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["picsafe_ai"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    '\.\.\.',
]
