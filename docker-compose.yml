services:
  picsafe-api:
    build: .
    environment:
      ENVIRONMENT: development
      DETECTOR_BACKEND: stub
      STUB_SCENARIO: empty
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - reports:/app/reports
    tmpfs:
      - /app/temp:size=128m,mode=0700,uid=999,gid=999
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    restart: unless-stopped

  picsafe-frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      picsafe-api:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped

volumes:
  reports:
